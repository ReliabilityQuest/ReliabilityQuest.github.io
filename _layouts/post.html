<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - Reliability Quest</title>
  <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
  <link rel="alternate" type="application/rss+xml" title="Reliability Quest" href="/feed.xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  {% if page.mathjax %}
  <script>
    MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  {% endif %}
  <style>
    :root {
      --text: #e8e6e3;
      --bg: #111;
      --muted: #888;
      --border: #333;
      --link: #6ba3d6;
    }
    [data-theme="light"] {
      --text: #222;
      --bg: #fefefe;
      --muted: #666;
      --border: #ddd;
      --link: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-size: 18px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.2s, color 0.2s;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1rem 2rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      transition: transform 0.3s;
    }
    header.hidden { transform: translateY(-100%); }
    .logo { font-weight: 600; font-size: 1.1rem; color: var(--text); }
    nav a { margin-left: 1.5rem; color: var(--muted); font-size: 0.9rem; }
    nav a:hover { color: var(--text); text-decoration: none; }

    main { max-width: 680px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }

    article header {
      position: static;
      padding: 0;
      background: none;
      border: none;
      display: block;
      margin-bottom: 2rem;
    }
    article h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    article .date { color: var(--muted); font-size: 0.9rem; }

    article h2 { font-size: 1.4rem; margin: 2rem 0 1rem; font-weight: 600; }
    article h3 { font-size: 1.15rem; margin: 1.5rem 0 0.75rem; font-weight: 600; }
    article p { margin-bottom: 1.25rem; }
    article ul, article ol { margin: 0 0 1.25rem 1.5rem; }
    article li { margin-bottom: 0.5rem; }
    article blockquote {
      border-left: 3px solid var(--border);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-style: italic;
    }
    article code {
      background: var(--border);
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      font-size: 0.9rem;
    }
    article pre {
      background: var(--border);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.5rem 0;
    }
    article pre code { background: none; padding: 0; }

    .back { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }

    .theme-toggle {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--border);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 600px) {
      html { font-size: 16px; }
      nav { display: none; }
      article h1 { font-size: 1.75rem; }
      main { padding-top: 5rem; }
    }
  </style>
</head>
<body>
  <header id="header">
    <a href="/" class="logo">Reliability Quest</a>
    <nav>
      <a href="/#articles">Articles</a>
      <a href="/#about">About</a>
      <a href="/#lab">Lab</a>
    </nav>
  </header>

  <main>
    <article>
      <header>
        <h1>{{ page.title }}</h1>
        <span class="date">{{ page.date | date: "%B %-d, %Y" }}</span>
      </header>
      {{ content }}
    </article>

    <div class="back">
      <a href="/">&larr; Back to home</a>
    </div>
  </main>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <span id="themeIcon">☀️</span>
  </button>

  <script>
    const theme = localStorage.getItem('theme') ||
      (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeIcon').textContent = theme === 'light' ? '🌙' : '☀️';

    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('themeIcon').textContent = next === 'light' ? '🌙' : '☀️';
    });

    let lastScroll = 0;
    let hideTimeout;
    window.addEventListener('scroll', () => {
      const header = document.getElementById('header');
      const currentScroll = window.pageYOffset;
      if (currentScroll > lastScroll && currentScroll > 100) {
        header.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
      }
      lastScroll = currentScroll;
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => header.classList.remove('hidden'), 2000);
    }, { passive: true });
  </script>
</body>
</html>
